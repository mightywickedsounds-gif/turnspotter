name: Fetch research data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [research/fetch_data.py, .github/workflows/fetch-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/fetch_data.py
      - name: Save data to the repository
        run: |
          git config user.name "turnspotter-bot"
          git config user.email "turnspotter-bot@users.noreply.github.com"
          git add research/data
          git commit -m "Update research data" || exit 0
          git pull --rebase origin main
          git push
