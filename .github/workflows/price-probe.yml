name: Price probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [research/price_probe.py, .github/workflows/price-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python research/price_probe.py
      - name: Save the results
        run: |
          git config user.name "turnspotter-bot"
          git config user.email "turnspotter-bot@users.noreply.github.com"
          git add research/price_probe.json
          git commit -qm "Price probe results" || exit 0
          for i in 1 2 3; do git fetch -q origin main && git rebase -q FETCH_HEAD && git push -q origin HEAD:main && break; sleep 5; done
