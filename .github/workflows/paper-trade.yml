name: Paper trade
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub fires this late and unevenly, so each run stays awake for ~5h40m
  workflow_dispatch:
  push:
    branches: [main]
    paths: [paper/trader.mjs, paper/trend.mjs, .github/workflows/paper-trade.yml]
permissions:
  contents: write
concurrency:
  group: paper-trade-v3
  cancel-in-progress: false   # the next run waits its turn, so there's almost always one awake
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # the latest main, not the commit that was current when this run was queued
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Trade every 5 minutes for ~5h40m
        run: |
          git config user.name "turnspotter-bot"
          git config user.email "turnspotter-bot@users.noreply.github.com"
          # Save the ledgers on top of the latest main. This job is the only writer of paper/*.json, so instead of
          # merging it resets to main and puts its own ledgers back: a failed save can never leave the repo stuck,
          # and every git network call has a time limit.
          save() {
            mkdir -p "$RUNNER_TEMP/keep"; cp paper/ledger.json paper/trend.json "$RUNNER_TEMP/keep/" 2>/dev/null
            for i in 1 2 3; do
              if timeout 60 git fetch -q origin main && git reset -q --hard FETCH_HEAD \
                 && cp "$RUNNER_TEMP"/keep/*.json paper/ && git add paper/ledger.json paper/trend.json \
                 && { git diff --cached --quiet || git commit -qm "Paper trading update"; } \
                 && timeout 60 git push -q origin HEAD:main; then echo "saved"; return 0; fi
              echo "save attempt $i failed"; sleep 10
            done
            cp "$RUNNER_TEMP"/keep/*.json paper/   # keep our ledgers for the next try
          }
          # a queued run can start long after it was scheduled: start from the newest ledgers, never a stale copy
          timeout 60 git fetch -q origin main && git reset -q --hard FETCH_HEAD
          end=$((SECONDS + 20400)); saved=-900   # save on the first pass too
          while true; do
            out=$( (timeout 240 node paper/trader.mjs; timeout 120 node paper/trend.mjs) 2>&1) || true; echo "$out"   # hard time limits so one stuck request can't freeze the loop
            # save when a trade opens or closes, otherwise at most every 15 minutes (keeps the commit history sane)
            if echo "$out" | grep -q TRADES_CHANGED || [ $((SECONDS - saved)) -ge 900 ] || [ $SECONDS -ge $end ]; then
              save; saved=$SECONDS
            fi
            [ $SECONDS -ge $end ] && break
            sleep 300
          done
