name: Paper trade
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub fires this late and unevenly, so each run stays awake for ~5h40m
  workflow_dispatch:
  push:
    branches: [main]
    paths: [paper/trader.mjs, paper/trend.mjs, .github/workflows/paper-trade.yml]
permissions:
  contents: write
concurrency:
  group: paper-trade
  cancel-in-progress: false   # the next run waits its turn, so there's almost always one awake
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Trade every 5 minutes for ~5h40m
        run: |
          git config user.name "turnspotter-bot"
          git config user.email "turnspotter-bot@users.noreply.github.com"
          end=$((SECONDS + 20400)); saved=-900   # save on the first pass too
          while true; do
            out=$( (node paper/trader.mjs; node paper/trend.mjs) 2>&1) || true; echo "$out"
            # save when a trade opens or closes, otherwise at most every 15 minutes (keeps the commit history sane)
            if echo "$out" | grep -q TRADES_CHANGED || [ $((SECONDS - saved)) -ge 900 ] || [ $SECONDS -ge $end ]; then
              git add paper/ledger.json paper/trend.json
              if git commit -qm "Paper trading update"; then
                for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
              fi
              saved=$SECONDS
            fi
            [ $SECONDS -ge $end ] && break
            sleep 300
          done
